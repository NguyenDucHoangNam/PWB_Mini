# coturn for the live room's WebRTC mesh. Read docs/deployment-plan.md §7 before changing anything.
#
# The secret and the realm are NOT here — docker-compose.prod.yml passes them as command-line flags
# so no credential is committed to the repository. Everything in this file is safe to read publicly.

listening-port=3478

# No TLS. Media is already encrypted end-to-end by DTLS-SRTP, so turns: would only hide the
# signalling to the relay from deep packet inspection. Enabling it would cost a dedicated subdomain,
# a certificate, and a restart of this process on every certbot renewal (coturn does not re-read
# certificates on its own). Without these two flags coturn still binds 5349 and asks for a cert.
no-tls
no-dtls

# Ephemeral credentials, per draft-uberti-behave-turn-rest-00. The backend hands each participant a
# username of `<unix-expiry>:<userId>` and base64(HMAC-SHA1(secret, username)); coturn recomputes the
# same HMAC and checks the expiry. Consequence: no `user=` line may exist in this file, and the
# secret here must be byte-identical to the backend's pwb.liveroom.rtc.turn.secret.
#
# `lt-cred-mech` is deliberately NOT set alongside this. coturn warns when both are given — the
# shared secret wins anyway — so listing it only adds a warning that looks like a misconfiguration.
use-auth-secret
stale-nonce=600

# The range actually published on the firewall. coturn defaults to 49152-65535; a range that wide is
# both a large ufw rule and a lot of ports to reason about. 40 ports is one relay allocation per
# participant per session with plenty of headroom for a 7-person room.
min-port=49160
max-port=49200

# A TURN server relays to wherever the client asks it to, which makes an unrestricted one a proxy
# into whatever it can reach. This process runs on the host network namespace (see the compose file)
# so without these lines a room participant could point it at 127.0.0.1 or the Docker bridge and
# reach Postgres, Redis, or an Elasticsearch running with authentication disabled.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Ceilings, not expected load. A 7-person mesh with every pair relayed needs 42 allocations; 200
# leaves room for several rooms at once while still bounding what a leaked credential can cost.
user-quota=12
total-quota=200

# Uncomment on a provider that gives the instance a private address 1:1 mapped to a public one
# (AWS EC2, GCP). Without it coturn advertises the private address as the relay candidate and every
# relayed connection fails. Providers that put the public address directly on the interface
# (Vultr, DigitalOcean, Hetzner) need nothing here.
# external-ip=PUBLIC_IP/PRIVATE_IP

fingerprint
no-cli
simple-log
log-file=stdout
# The image runs turnserver as a non-root user, which cannot write the default /var/run location.
# Left at the default it prints a failure warning on every start that means nothing.
pidfile=/var/tmp/turnserver.pid
