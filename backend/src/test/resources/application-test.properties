# Test configuration for Spring Test Context
# This file is used by @SpringBootTest and slice tests (@WebMvcTest, @DataJpaTest, etc.)

# Datasource - Testcontainers or H2 in-memory
spring.datasource.url=jdbc:postgresql://localhost:5432/test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000

# JWT
app.security.jwt.secret=test-secret-key-for-unit-testing-minimum-32-characters-long
app.security.jwt.issuer=pwb-mini-test
app.security.jwt.access-token-ttl-seconds=900
app.security.jwt.refresh-token-ttl-seconds=604800
app.security.jwt.blacklist-clock-skew-buffer-seconds=30
app.security.jwt.shadow-grace-seconds=10

# Login attempt config
app.iam.login.max-failed-attempts=5
app.iam.login.failed-attempt-window-seconds=900
app.iam.login.lockout-seconds=900
app.iam.login.ip-max-failed-attempts=10
app.iam.login.ip-attempt-window-seconds=3600
app.iam.login.ip-lockout-seconds=3600
app.iam.login.max-concurrent-sessions=5

# Account deletion
app.iam.account-deletion.grace-days=30

# OTP
app.iam.otp.ttl-seconds=300
app.iam.otp.max-attempts=5
app.iam.otp.resend-cooldown-seconds=60

# Password reset
app.iam.password-reset.ttl-seconds=600

# Avatar upload
app.iam.avatar.max-size-bytes=2097152

# Turnstile captcha (disabled in test)
app.captcha.turnstile.enabled=false

# Google OAuth (disabled in test)
app.oauth.google.client-id=
app.oauth.google.enabled=false

# S3 Storage (mock in test)
app.storage.s3.enabled=false
app.storage.s3.bucket=pwb-test

# Logging
logging.level.com.pwb.backend=INFO
logging.level.org.springframework.security=WARN
