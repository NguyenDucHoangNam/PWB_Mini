# =============================================================================
# Shared test-only configuration. Loaded automatically from
# src/test/resources so every @SpringBootTest starts with sane defaults
# without requiring @TestPropertySource on each class.
# =============================================================================

app:
  security:
    cors:
      allowed-origins: http://localhost:3000
    rate-limit:
      ip:
        max-requests: 10000
        window-seconds: 1

# 32+ bytes so JwtService @PostConstruct validation passes
JWT_SECRET: test-secret-32-bytes-aaaaaaaaaaaaaaaaaaaaaaaa