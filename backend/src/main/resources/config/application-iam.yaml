app:
  iam:
    jwt:
      secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyPleaseChangeInProduction_atLeast256Bits}
      access-token-expiration: 900
      refresh-token-expiration: 604800
    otp:
      expiration: 300
      cooldown: 60
      max-attempts: 5
    anonymization:
      cron: "0 0 0 * * ?"
    google:
      client-id: ${GOOGLE_CLIENT_ID}
    geoip:
      database-path: ${GEOIP_DB_PATH:classpath:geoip/GeoLite2-City.mmdb}

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
