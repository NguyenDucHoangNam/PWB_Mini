app:
  iam:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: 900
      refresh-token-expiration: 604800
    otp:
      expiration: 300
      cooldown: 60
      max-attempts: 5
    login:
      max-failed-attempts: 5
      lockout-ttl-seconds: 900
      password-reset-token-ttl-seconds: 600
    account:
      deletion-grace-days: 30
    outbox:
      dead-letter-after-retries: 5
    anonymization:
      cron: "0 0 0 * * ?"
    google:
      client-id: ${GOOGLE_CLIENT_ID}
    geoip:
      database-path: ${GEOIP_DB_PATH:classpath:geoip/GeoLite2-City.mmdb}
    session:
      # Localhost runs over plain HTTP - marking the refresh cookie
      # Secure would prevent it from being sent on every request and
      # break the silent refresh flow. Override to `true` in prod.
      cookie-secure: ${SESSION_COOKIE_SECURE:false}
      cookie-same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
