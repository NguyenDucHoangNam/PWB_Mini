spring:
  application:
    name: pwb-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

app:
  rate-limit:
    enabled: true
    default-permits-per-window: 100
    default-window: 1m
    rules:
      - path-pattern: /api/v1/auth/check-username
        method: GET
        permits-per-window: 20
        window: 1m
      - path-pattern: /api/v1/auth/register
        method: POST
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/auth/verify-otp
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/auth/resend-otp
        method: POST
        permits-per-window: 3
        window: 1m
      - path-pattern: /api/v1/auth/login
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/auth/login/google
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/auth/refresh
        method: POST
        permits-per-window: 20
        window: 1m
      - path-pattern: /api/v1/auth/logout
        method: POST
        permits-per-window: 20
        window: 1m
      - path-pattern: /api/v1/auth/forgot-password
        method: POST
        permits-per-window: 3
        window: 1m
      - path-pattern: /api/v1/auth/reset-password
        method: POST
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/auth/change-password
        method: POST
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/auth/me
        method: GET
        permits-per-window: 60
        window: 1m
      - path-pattern: /api/v1/auth/profile
        method: PUT
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/auth/profile/avatar
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/auth/account
        method: DELETE
        permits-per-window: 2
        window: 1m
      - path-pattern: /api/v1/auth/account/cancel-deletion
        method: POST
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/auth/sessions
        method: GET
        permits-per-window: 30
        window: 1m
      - path-pattern: /api/v1/auth/sessions
        method: DELETE
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/auth/sessions/*
        method: DELETE
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/demos/presigned-upload-url
        method: POST
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/demos/confirm-upload
        method: POST
        permits-per-window: 30
        window: 1m
      - path-pattern: /api/v1/demos/*/status
        method: GET
        permits-per-window: 120
        window: 1m
      - path-pattern: /api/v1/voice-tags
        method: POST
        permits-per-window: 2
        window: 1m
      - path-pattern: /api/v1/voice-tags/*/preview
        method: GET
        permits-per-window: 60
        window: 1m
      - path-pattern: /api/v1/voice-tags/*/default
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/voice-tags
        method: GET
        permits-per-window: 60
        window: 1m
      - path-pattern: /api/v1/voice-tags/*
        method: DELETE
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/demos/*/distribute
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/demos/*/distributions
        method: GET
        permits-per-window: 30
        window: 1m
      - path-pattern: /api/v1/demos/shared/*
        method: GET
        permits-per-window: 60
        window: 1m
      - path-pattern: /api/v1/stream/keys/*
        method: GET
        permits-per-window: 60
        window: 1m
      - path-pattern: /api/v1/stream/*/playlist.m3u8
        method: GET
        permits-per-window: 30
        window: 1m
      - path-pattern: /api/v1/demos/shared/*/track-play
        method: POST
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/internal/cdn-events
        method: POST
        permits-per-window: 60
        window: 1m
      - path-pattern: /api/v1/demos/recipients/suggest
        method: GET
        permits-per-window: 30
        window: 1m
      - path-pattern: /api/v1/rooms
        method: POST
        permits-per-window: 3
        window: 1m
      - path-pattern: /api/v1/rooms/*/join
        method: POST
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/rooms/*/waiting/approve
        method: POST
        permits-per-window: 20
        window: 1m
      - path-pattern: /api/v1/rooms/*/source
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/rooms/*/close
        method: POST
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/webrtc/config
        method: GET
        permits-per-window: 60
        window: 1m
  security:
    actuator:
      public: false
    jwt:
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
      shadow-grace-seconds: 10
      issuer: pwb-mini
      header-name: Authorization
      header-prefix: "Bearer "
      blacklist-clock-skew-buffer-seconds: 30
      secret: ${JWT_SECRET:}
      refresh-secret: ${JWT_REFRESH_SECRET:}
    outbox:
      encryption-key: ${IAM_OUTBOX_ENCRYPTION_KEY:}
    trusted-proxies:
      trust-forwarded-headers: false
      cidrs: ""
    cookie:
      secure: false
      samesite: Strict
    oauth:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
    captcha:
      turnstile:
        enabled: false
        secret-key: ${APP_SECURITY_CAPTCHA_TURNSTILE_SECRET_KEY:}
        verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
        timeout-millis: 3000
        fail-open: true
        site-key: ""
  login:
    max-concurrent-sessions: 3
    max-failed-attempts: 5
    failed-attempt-window-seconds: 900
    lockout-seconds: 900
    ip-max-failed-attempts: 20
    ip-attempt-window-seconds: 300
    ip-lockout-seconds: 900
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    partitions: 3
    replicas: 1
    producer:
      retries: 3
      retry-backoff-ms: 100
      acks-timeout-ms: 30000
      idempotence: true
    consumer:
      group-id-prefix: pwb
      max-poll-records: 500
      concurrency: 3
    retry:
      max-attempts: 5
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 30000
    mail-worker:
      group-id: mail-worker
  outbox:
    retry-interval-ms: 30000
    max-attempts: 10
    retry-batch-size: 100
    backoff:
      initial-seconds: 30
      max-seconds: 21600
      multiplier: 3
  iam:
    otp:
      ttl-seconds: 300
      attempt-ttl-seconds: 600
      lockout-ttl-seconds: 900
      resend-cooldown-seconds: 60
      max-attempts: 5
    password-reset:
      token-ttl-seconds: 600
      support-email: security@pwb-mini.dev
      frontend-base-url: https://pwbmini.com
    account-deletion:
      grace-days: 30
      support-email: support@pwb-mini.dev
      login-url: https://pwbmini.com/login
    account-anonymization:
      cron: "0 0 2 * * *"
      grace-days: 30
      batch-size: 100
    avatar:
      max-size-bytes: 2097152
  storage:
    enabled: true
    provider: s3
    endpoint: ${STORAGE_ENDPOINT:}
    region: ap-southeast-1
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style-access-enabled: true
    public-base-url: ${STORAGE_PUBLIC_URL_PREFIX:}
    presigned-url-expiry-seconds: 900
    buckets:
      avatar: pwb-avatars
      demo-audio: pwb-demo-audio
      cover-image: pwb-covers
      generic: pwb-misc
      voice-tag: pwb-voice-tags
  audio:
    temp-dir: /tmp/pwb-audio
    ffmpeg-path: ffmpeg
    ffprobe-path: ffprobe
    max-file-size-bytes: 209715200
    worker-concurrency: 2
    waveform-peaks: 200
    hls-segment-seconds: 6
    stream:
      cookie-secret: ${AUDIO_STREAM_COOKIE_SECRET:}
      cookie-secret-previous: ${AUDIO_STREAM_COOKIE_SECRET_PREVIOUS:}
      cookie-ttl-seconds: 1800
      cookie-name: __Host-pwb_stream_sess
      cookie-secure: false
      cookie-same-site: Strict
      cidr-mask-bits-ipv4: 24
      cidr-mask-bits-ipv6: 48
      playlist-signing-key: ${AUDIO_PLAYLIST_SIGNING_KEY:}
      playlist-signature-ttl-seconds: 600
      playlist-cache-ttl-seconds: 30
      ip-hash-salt: ${AUDIO_IP_HASH_SALT:}
      cdn-origin-verify-enabled: false
      cdn-origin-verify-secret: ${AUDIO_CDN_ORIGIN_VERIFY_SECRET:}
    hls:
      aes-key-bytes: 16
      segment-duration-seconds: 6
      key-rotation-enabled: true
      key-rotation-on-revoke: true
      previous-key-retention-days: 30
    presigned:
      expiry-seconds: 60
      upload-claim-ttl-seconds: 7200
    quota:
      max-active-demos-per-user: 50
      max-active-audio-bytes-per-user: 10737418240
  share:
    daily-recipients-limit: 100
    daily-count-limit: 500
    distribution-cache-ttl-seconds: 86400
    blacklist-domain-check-enabled: true
    blacklist-cache-ttl-seconds: 3600
    share-link-base-url: https://pwbmini.com/shared/
  voice-tag:
    max-raw-text-length: 100
    max-ssml-length: 250
    max-nested-depth: 3
    min-mp3-bytes: 1024
    max-mp3-bytes: 5242880
    daily-limit-per-user: 30
    max-active-per-user: 50
    max-storage-bytes-per-user: 209715200
    voice-list-cache-ttl-seconds: 86400
    preview-url-ttl-seconds: 30
    restore-window-days: 7
    compensation:
      max-attempts: 5
      initial-delay-millis: 2000
      max-delay-millis: 60000
      multiplier: 3.0
    gcp:
      endpoint: google.cloud.texttospeech.v1.TextToSpeechClient
      connect-timeout-ms: 5000
      read-timeout-ms: 15000
  liveroom:
    code-length: 6
    alphabet: ABCDEFGHJKLMNPQRSTUVWXYZ23456789
    lock-ttl-seconds: 10
    code-collision-max-retries: 3
    phase1-ttl-seconds: 30
    phase2-ttl-seconds: 14400
    host-grace-period-minutes: 5
    empty-room-grace-minutes: 15
    orphan-threshold-minutes: 1
    orphan-scan-cron: "0 */2 * * * *"
    lifecycle-cleanup-cron: "0 */1 * * * *"
    keyspace-listener-enabled: false
    max-participants: 7
    handshake-timeout-seconds: 10
    heartbeat-incoming-ms: 10000
    heartbeat-outgoing-ms: 10000
    waiting-entry-ttl-seconds: 14400
    members-ttl-seconds: 14400
    waiting-entry-max-age-seconds: 300
    temporary-token-ttl-seconds: 14400
    listener-role: LISTENER
    webrtc:
      stun-server: "stun:stun.l.google.com:19302"
      turn-servers:
        - "turn:turn.pwbmini.com:3478?transport=udp"
        - "turn:turn.pwbmini.com:3478?transport=tcp"
      turn-static-secret: ${TURN_STATIC_SECRET:}
      credential-ttl-seconds: 86400
      signalling-rate-limit-per-minute: 100
    chat:
      text-rate-limit-per-minute: 30
      reaction-rate-limit-per-minute: 120
      max-text-length: 200
      max-payload-bytes: 1024
      allowed-emojis:
        - "\uD83D\uDD25"
        - "\uD83D\uDC4D"
        - "\uD83D\uDC4F"
        - "\uD83D\uDCAF"

mail:
  from: "PWB Mini <noreply@pwb-mini.dev>"
  security-from: "PWB Mini Security <security@pwb-mini.dev>"

spring.servlet.multipart:
  enabled: true
  max-file-size: 220MB
  max-request-size: 220MB
  file-size-threshold: 2MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200

spring.lifecycle.timeout-shutdown: 30s

logging.level.org.apache.catalina.loader.WebappClassLoaderBase: ERROR
