spring:
  application:
    name: pwb-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}

app:
  rate-limit:
    enabled: true
    default-permits-per-window: 100
    default-window: 1m
    rules:
      - path-pattern: /api/v1/auth/register
        method: POST
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/auth/verify-otp
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/auth/resend-otp
        method: POST
        permits-per-window: 3
        window: 1m
      - path-pattern: /api/v1/auth/login
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/auth/login/google
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/auth/refresh
        method: POST
        permits-per-window: 20
        window: 1m
      - path-pattern: /api/v1/auth/logout
        method: POST
        permits-per-window: 20
        window: 1m
      - path-pattern: /api/v1/auth/forgot-password
        method: POST
        permits-per-window: 3
        window: 1m
      - path-pattern: /api/v1/auth/reset-password
        method: POST
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/auth/change-password
        method: POST
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/auth/me
        method: GET
        permits-per-window: 60
        window: 1m
      - path-pattern: /api/v1/auth/profile
        method: PUT
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/auth/profile/avatar
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/auth/account
        method: DELETE
        permits-per-window: 2
        window: 1m
      - path-pattern: /api/v1/auth/account/cancel-deletion
        method: POST
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/auth/sessions
        method: GET
        permits-per-window: 30
        window: 1m
      - path-pattern: /api/v1/auth/sessions
        method: DELETE
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/auth/sessions/*
        method: DELETE
        permits-per-window: 10
        window: 1m
  security:
    jwt:
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
      shadow-grace-seconds: 10
      issuer: pwb-mini
      header-name: Authorization
      header-prefix: "Bearer "
      blacklist-clock-skew-buffer-seconds: 30
    cookie:
      secure: false
      samesite: Strict
    oauth:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
  login:
    max-concurrent-sessions: 3
    max-failed-attempts: 5
    failed-attempt-window-seconds: 900
    lockout-seconds: 900
  outbox:
    retry-interval-ms: 30000
    max-attempts: 10
    retry-batch-size: 100
    backoff:
      initial-seconds: 30
      max-seconds: 21600
      multiplier: 3
  iam:
    otp:
      ttl-seconds: 300
      attempt-ttl-seconds: 600
      lockout-ttl-seconds: 900
      resend-cooldown-seconds: 60
      max-attempts: 5
    password-reset:
      token-ttl-seconds: 600
      support-email: security@pwb-mini.dev
      frontend-base-url: https://pwbmini.com
    account-deletion:
      grace-days: 30
      support-email: support@pwb-mini.dev
      login-url: https://pwbmini.com/login
    account-anonymization:
      cron: "0 0 2 * * *"
      grace-days: 30
      batch-size: 100
    avatar:
      max-size-bytes: 2097152
  storage:
    enabled: true
    provider: s3
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style-access-enabled: true
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    presigned-url-expiry-seconds: 900
    buckets:
      avatar: ${S3_BUCKET_AVATAR:pwb-avatars}
      demo-audio: ${S3_BUCKET_DEMO_AUDIO:pwb-demo-audio}
      cover-image: ${S3_BUCKET_COVER_IMAGE:pwb-covers}
      generic: ${S3_BUCKET_GENERIC:pwb-misc}

mail:
  from: PWB Mini <noreply@pwb-mini.dev>
  security-from: PWB Mini Security <security@pwb-mini.dev>

spring.servlet.multipart:
  enabled: true
  max-file-size: 2MB
  max-request-size: 4MB
  file-size-threshold: 1MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
