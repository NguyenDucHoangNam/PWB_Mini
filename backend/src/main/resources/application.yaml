spring:
  application:
    name: pwb-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

app:
  rate-limit:
    enabled: true
    default-permits-per-window: 100
    default-window: 1m
    rules:
      - path-pattern: /api/v1/auth/register
        method: POST
        permits-per-window: 5
        window: 1m
      - path-pattern: /api/v1/auth/verify-otp
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/auth/resend-otp
        method: POST
        permits-per-window: 3
        window: 1m
      - path-pattern: /api/v1/auth/login
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/auth/login/google
        method: POST
        permits-per-window: 10
        window: 1m
      - path-pattern: /api/v1/auth/refresh
        method: POST
        permits-per-window: 20
        window: 1m
  security:
    jwt:
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
      shadow-grace-seconds: 10
      issuer: pwb-mini
      header-name: Authorization
      header-prefix: "Bearer "
    cookie:
      secure: false
      samesite: Strict
    oauth:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
  login:
    max-concurrent-sessions: 3
    max-failed-attempts: 5
    failed-attempt-window-seconds: 900
    lockout-seconds: 900
  outbox:
    retry-interval-ms: 30000
    max-attempts: 10
    retry-batch-size: 100
    backoff:
      initial-seconds: 30
      max-seconds: 21600
      multiplier: 3
  iam:
    otp:
      ttl-seconds: 300
      attempt-ttl-seconds: 600
      lockout-ttl-seconds: 900
      resend-cooldown-seconds: 60
      max-attempts: 5

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
