INTERNAL_ERROR=Internal server error
VALIDATION_FAILED=Request validation failed
UNAUTHORIZED=Authentication required
FORBIDDEN=Access denied
NOT_FOUND=Resource not found
METHOD_NOT_ALLOWED=HTTP method not allowed
CONFLICT=Resource state conflict
RATE_LIMITED=Too many requests
QUOTA_EXCEEDED=Quota exceeded
RESOURCE_BUSY=Resource is busy
IDEMPOTENCY_CONFLICT=Idempotency key conflict
UNSUPPORTED_MEDIA_TYPE=Unsupported media type
PAYLOAD_TOO_LARGE=Request payload too large
EXTERNAL_SERVICE_FAILURE=Upstream service failure
UPSTREAM_TIMEOUT=Upstream service timeout

# IAM error messages (default = English)
EMAIL_ALREADY_EXISTS=Email already registered
EMAIL_DISPOSABLE=Disposable email address not allowed
INVALID_OTP=Invalid or expired OTP code
OTP_LOCKED=Too many invalid OTP attempts, please try again later
OTP_RESEND_COOLDOWN=Please wait before requesting a new OTP
USER_NOT_FOUND=User not found
USER_ALREADY_VERIFIED=User already verified
WEAK_PASSWORD=Password does not meet security requirements

# Login & Refresh errors
BAD_CREDENTIALS=Invalid username or password
ACCOUNT_BANNED=Account has been disabled
REGISTRATION_IN_PROGRESS=Account is pending OTP verification
ACCOUNT_TEMPORARILY_LOCKED=Account temporarily locked due to too many failed attempts
INVALID_OAUTH_TOKEN=Google authentication token is invalid or expired
JWT_EXPIRED=Access token has expired
INVALID_REFRESH_TOKEN=Refresh token is missing or expired
TOKEN_THEFT_DETECTED=Token reuse detected, all sessions have been revoked
TOKEN_BLACKLISTED=Access token has been revoked
RATE_LIMIT_EXCEEDED=Too many requests

# Forgot & Change password
INVALID_RESET_TOKEN=Password reset token is invalid or has expired
INVALID_OLD_PASSWORD=Current password is incorrect
PASSWORD_REUSE_BLOCKED=New password must be different from current password
OAUTH_ONLY_ACCOUNT=Account registered via Google does not support password change
PASSWORD_CONFIRMATION_MISMATCH=Password confirmation does not match

# Profile & Account deletion
INVALID_PASSWORD_REAUTH=Re-authentication password is incorrect
REAUTH_REQUIRED=Re-authentication is required: provide password (LOCAL) or idToken (Google)
DELETION_ALREADY_REQUESTED=Account deletion has already been requested
USER_NOT_PENDING_DELETION=Account is not in PENDING_DELETION state
AVATAR_UPLOAD_FAILED=Failed to upload avatar
AVATAR_FILE_TOO_LARGE=Avatar file exceeds the maximum allowed size
AVATAR_INVALID_TYPE=Avatar file must be an image (jpeg, jpg, png)
AVATAR_FILE_EMPTY=Avatar file is empty
PROFILE_UPDATE_FORBIDDEN=One or more fields cannot be modified through this endpoint

# Session management
SESSION_NOT_FOUND=Session not found or does not belong to current user
CANNOT_REVOKE_CURRENT_SESSION=Cannot revoke the current session; use logout instead

# Auth success messages
AUTH_REGISTER_INITIATED=Registration initiated, please verify OTP
AUTH_OTP_VERIFIED=OTP verified successfully
AUTH_OTP_RESENT=OTP resent successfully
AUTH_LOGIN_SUCCESSFUL=Login successful
AUTH_GOOGLE_LOGIN_SUCCESSFUL=Google login successful
AUTH_TOKEN_REFRESHED=Token refreshed successfully
AUTH_LOGOUT_SUCCESSFUL=Logged out

# Profile success messages
PROFILE_FETCHED=Profile fetched successfully
PROFILE_UPDATED=Profile updated successfully
AVATAR_UPLOADED=Avatar uploaded successfully

# Password success messages
PASSWORD_RESET_LINK_SENT=If an account exists for that email, a password reset link has been sent
PASSWORD_RESET_SUCCESSFUL=Password has been reset successfully
PASSWORD_CHANGED=Password changed successfully

# Account lifecycle success messages
ACCOUNT_DELETION_SCHEDULED=Account deletion scheduled. Data will be permanently anonymized in {0} days.
ACCOUNT_DELETION_CANCELLED=Account deletion cancelled

# Session success messages
SESSIONS_FETCHED=Active sessions fetched successfully
SESSION_REVOKED=Session revoked successfully
OTHER_SESSIONS_REVOKED=Other sessions revoked successfully

# Admin job success messages
ANONYMIZATION_TRIGGERED=Anonymization job triggered successfully
