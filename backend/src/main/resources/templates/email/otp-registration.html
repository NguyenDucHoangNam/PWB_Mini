<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>OTP Verification</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }
        .wrapper {
            width: 100%;
            padding: 48px 16px;
        }
        .card {
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px -15px rgba(15, 23, 42, 0.18);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            padding: 40px 32px;
            text-align: center;
        }
        .brand {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        .brand-mark {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .content {
            padding: 40px 36px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 12px;
            color: #0f172a;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 32px;
        }
        .otp-wrap {
            text-align: center;
            margin: 0 0 28px;
        }
        .otp-label {
            font-size: 12px;
            font-weight: 600;
            color: #6366f1;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 12px;
        }
        .otp {
            display: inline-block;
            font-family: "SF Mono", Menlo, Consolas, monospace;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 12px;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            padding: 20px 36px;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }
        .otp-hint {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin: 20px 0 0;
        }
        .meta {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
            text-align: center;
            margin-top: 28px;
        }
        .footer {
            padding: 24px 32px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }
        @media (max-width: 600px) {
            .wrapper { padding: 24px 12px; }
            .content { padding: 32px 24px; }
            .otp { font-size: 30px; letter-spacing: 8px; padding: 16px 28px; }
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; }
            .card { background: #1e293b; }
            h1 { color: #f1f5f9; }
            .subtitle { color: #94a3b8; }
            .meta { background: #0f172a; color: #cbd5e1; }
            .footer { background: #0f172a; border-top-color: #334155; color: #64748b; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="header">
            <span class="brand-mark" th:text="${appName}">Producer Workbench</span>
            <div class="brand">Producer Workbench</div>
        </div>
        <div class="content">
            <h1>Verify your email</h1>
            <p class="subtitle" th:text="'Hi ' + ${fullName} + ', use the code below to finish setting up your account.'">Hi, use the code below to finish setting up your account.</p>
            <div class="otp-wrap">
                <div class="otp-label">Your verification code</div>
                <div class="otp" th:text="${otp}">000000</div>
                <div class="otp-hint">This code expires in <strong th:text="${expiresMinutes}">10</strong> minutes.</div>
            </div>
            <div class="meta">If you didn't request this, you can safely ignore this email.</div>
        </div>
        <div class="footer">
            &copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span>
            <span th:text="${appName}">Producer Workbench</span> &middot; All rights reserved.
        </div>
    </div>
</div>
</body>
</html>
