<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>OTP Verification</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f5f7fb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1f2937;
        }
        .wrapper {
            width: 100%;
            padding: 32px 16px;
            box-sizing: border-box;
        }
        .card {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
            padding: 32px;
        }
        .brand {
            font-size: 20px;
            font-weight: 700;
            color: #4f46e5;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 12px;
        }
        p {
            line-height: 1.55;
            margin: 0 0 16px;
            color: #4b5563;
        }
        .otp {
            display: inline-block;
            font-size: 30px;
            letter-spacing: 8px;
            font-weight: 700;
            color: #111827;
            background: #f3f4f6;
            padding: 14px 24px;
            border-radius: 8px;
            margin: 16px 0;
        }
        .meta {
            font-size: 13px;
            color: #6b7280;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 24px;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; color: #e5e7eb; }
            .card { background: #1e293b; }
            p { color: #cbd5e1; }
            .otp { background: #334155; color: #f1f5f9; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="brand" th:text="${appName}">PWB Mini</div>
        <h1>Verify your email</h1>
        <p th:text="'Hi ' + ${fullName} + ', use the code below to finish setting up your account. The code expires in ' + ${expiresMinutes} + ' minutes.'">Hi, use the code below to finish setting up your account.</p>
        <div class="otp" th:text="${otp}">000000</div>
        <p class="meta">If you didn't request this, you can safely ignore this email.</p>
    </div>
    <div class="footer">
        &copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span>
        <span th:text="${appName}">PWB Mini</span>. All rights reserved.
    </div>
</div>
</body>
</html>
