# System Error Codes (keys phải khớp với SysErrorCode enum)
FILE_TOO_LARGE=Tập tin tải lên vượt quá kích thước cho phép
RESOURCE_NOT_FOUND=Không tìm thấy tài nguyên được yêu cầu
INTERNAL_SERVER_ERROR=Đã xảy ra lỗi không mong muốn

# Common / Shared
COMMON_OPERATION_SUCCESS=Thao tác hoàn thành thành công
COMMON_OPERATION_FAILED=Thao tác thất bại
COMMON_NOT_FOUND=Không tìm thấy mục này

# Rate Limiting (cross-cutting, shared by all modules)
RATE_LIMITED_MESSAGE=Quá nhiều yêu cầu. Vui lòng thử lại sau.

# Validation (cross-cutting, shared by all modules)
VALIDATION_FAILED=Yêu cầu không hợp lệ
VALIDATION_INVALID_REQUEST=Dữ liệu yêu cầu không hợp lệ
VALIDATION_CONSTRAINT_VIOLATION=Một hoặc nhiều ràng buộc đã bị vi phạm

# Data Integrity (shared across modules)
DATA_INTEGRITY_VIOLATION=Xảy ra lỗi vi phạm tính toàn vẹn dữ liệu
# HTTP / request errors (cross-cutting)
INVALID_REQUEST=Yêu cầu không hợp lệ
INVALID_PARAMETER=Tham số yêu cầu không hợp lệ
MALFORMED_REQUEST_BODY=Không thể đọc nội dung yêu cầu
METHOD_NOT_ALLOWED=Phương thức HTTP không được hỗ trợ cho endpoint này
CONCURRENT_UPDATE=Tài nguyên vừa bị thay đổi bởi một yêu cầu khác. Vui lòng thử lại.
