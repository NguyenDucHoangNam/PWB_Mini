# System Error Codes (keys phải khớp với SysErrorCode enum)
FILE_TOO_LARGE=Uploaded file exceeds the maximum allowed size
ACCESS_DENIED=You do not have permission to perform this action
RESOURCE_NOT_FOUND=The requested resource was not found
INTERNAL_SERVER_ERROR=An unexpected error occurred

# Common / Shared
COMMON_OPERATION_SUCCESS=Operation completed successfully
COMMON_OPERATION_FAILED=Operation failed
COMMON_NOT_FOUND=Item not found

# Rate Limiting (cross-cutting, shared by all modules)
RATE_LIMITED_MESSAGE=Too many requests. Please slow down.

# Validation (cross-cutting, shared by all modules)
VALIDATION_FAILED=Validation failed
VALIDATION_INVALID_REQUEST=Invalid request data
VALIDATION_CONSTRAINT_VIOLATION=One or more constraints were violated
validation.song.durationSeconds.notNull=Song duration must not be null
validation.song.durationSeconds.positive=Song duration must be greater than 0

# Data Integrity (shared across modules)
DATA_INTEGRITY_VIOLATION=Data integrity violation occurred
# HTTP / request errors (cross-cutting)
INVALID_REQUEST=The request is invalid
INVALID_PARAMETER=One or more request parameters are invalid
MALFORMED_REQUEST_BODY=The request body could not be parsed
METHOD_NOT_ALLOWED=The HTTP method is not supported for this endpoint
CONCURRENT_UPDATE=The resource was modified by another request. Please retry.
