<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:replace="~{email/_layout :: layout(~{::section})}">
    <section>
      <h2 style="margin:0 0 16px 0;font-size:18px;color:#111827;"
          th:text="${#messages.msg('email.register.otp.title')}">Title</h2>
      <p style="margin:0 0 16px 0;color:#374151;line-height:1.5;"
         th:text="${#messages.msg('email.register.otp.body', email)}">Body greeting</p>
      <p style="margin:0 0 24px 0;color:#374151;line-height:1.5;font-size:32px;font-weight:700;letter-spacing:6px;text-align:center;color:#1f2937;"
         th:text="${otp}">000000</p>
      <p style="margin:0;color:#6b7280;font-size:13px;line-height:1.5;"
         th:text="${#messages.msg('email.register.otp.expiry')}">Expiry</p>
    </section>
  </div>
</body>
</html>
