<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="layout(content)">
    <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;background-color:#f4f4f4;padding:24px;font-family:Arial,Helvetica,sans-serif;">
      <tr>
        <td align="center">
          <table role="presentation" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="padding:24px 32px;background-color:#1f2937;color:#ffffff;">
                <h1 style="margin:0;font-size:20px;font-weight:600;letter-spacing:0.5px;">PWB</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <div th:replace="${content}"></div>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px;background-color:#f9fafb;color:#6b7280;font-size:12px;text-align:center;">
                <p style="margin:0;" th:text="${#messages.msg('email.footer')}">Footer</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
