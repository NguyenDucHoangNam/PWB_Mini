<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:replace="~{email/_layout :: layout(~{::section})}">
    <section>
      <h2 style="margin:0 0 16px 0;font-size:18px;color:#111827;"
          th:text="${#messages.msg('email.password.reset.title')}">Title</h2>
      <p style="margin:0 0 16px 0;color:#374151;line-height:1.5;"
         th:text="${#messages.msg('email.password.reset.body', email)}">Body greeting</p>
      <p style="margin:0 0 24px 0;text-align:center;">
        <a th:href="${resetLink}"
           style="display:inline-block;padding:12px 24px;background-color:#1f2937;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600;"
           th:text="${#messages.msg('email.password.reset.cta')}">CTA</a>
      </p>
      <p style="margin:0;color:#6b7280;font-size:13px;line-height:1.5;"
         th:text="${#messages.msg('email.password.reset.expiry', ttlMinutes)}">Expiry</p>
    </section>
  </div>
</body>
</html>
