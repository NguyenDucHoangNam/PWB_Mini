# Success messages
LIVEROOM_ROOM_CREATED=Phòng đã được tạo
LIVEROOM_ROOM_RETRIEVED=Lấy thông tin phòng thành công
LIVEROOM_ROOM_JOINED=Bạn đã tham gia phòng
LIVEROOM_ROOM_LEFT=Bạn đã rời phòng
LIVEROOM_ROOM_ENDED=Phòng đã kết thúc
LIVEROOM_ROOM_REOPENED=Phòng đã được mở lại
LIVEROOM_ROOM_REVIVED=Phòng đã được hồi sinh bởi chủ phòng
LIVEROOM_REQUEST_CREATED=Đã gửi yêu cầu tham gia
LIVEROOM_REQUEST_APPROVED=Yêu cầu tham gia đã được duyệt
LIVEROOM_REQUEST_REJECTED=Yêu cầu tham gia đã bị từ chối
LIVEROOM_REQUEST_CANCELLED=Yêu cầu tham gia đã được hủy
LIVEROOM_PARTICIPANT_KICKED=Đã đuổi người tham gia khỏi phòng
LIVEROOM_MIC_MUTED=Đã tắt mic của người tham gia
LIVEROOM_MEDIA_UPDATED=Cập nhật trạng thái camera/mic thành công

# Warning messages
LIVEROOM_ROOM_FULL=Phòng đã đầy, vui lòng thử lại sau
LIVEROOM_REJECTED_BY_OWNER=Yêu cầu tham gia đã bị chủ phòng từ chối
LIVEROOM_ROOM_AUTO_ENDED_OWNER_GRACE=Phòng đã kết thúc - chủ phòng không quay lại
LIVEROOM_OWNER_GRACE_EXPIRING=Chủ phòng còn {0} giây để quay lại
LIVEROOM_AUTO_ENDED_GRACE=Phòng tự kết thúc (chủ phòng đã rời)
LIVEROOM_AUTO_ENDED_EMPTY=Phòng tự kết thúc (không có người)
LIVEROOM_MEDIA_PERMISSION_DENIED=Không có quyền truy cập camera/mic. Bạn vẫn có thể nghe.
LIVEROOM_MEDIA_NETWORK_UNSTABLE=Mạng không ổn định. Nên tắt video.
LIVEROOM_MEDIA_CONNECTING=Đang kết nối media...
LIVEROOM_MULTI_TAB_CONFLICT=Bạn đang ở phòng này ở tab khác
LIVEROOM_MIC_MUTED_BY_OWNER=Chủ phòng đã tắt mic của bạn
LIVEROOM_MUSIC_OWNER_PAUSED=Chủ phòng đã rời, nhạc tạm dừng

# Live Room Error Codes
LR_001=Không tìm thấy phòng.
LR_002=Phòng đã kết thúc.
LR_003=Bạn đã có một phòng trùng tên này.
LR_004=Tên phòng không hợp lệ.
LR_005=Không tạo được mã phòng duy nhất. Vui lòng thử lại.
LR_006=Bạn đã thử quá nhiều mã phòng. Vui lòng thử lại sau.
LR_007=Chỉ phòng đã kết thúc mới có thể mở lại.
LR_008=Đã quá thời gian hoàn tác.
LR_009=Grace period phải từ 30 đến 1800 giây.
LR_010=Phòng đã kết thúc do thay đổi quyền của chủ phòng.

LR_020=Chỉ chủ phòng mới có quyền này.
LR_021=Chỉ tài khoản PRO mới có quyền tạo phòng.
LR_022=Bạn là chủ phòng này, không cần gửi yêu cầu tham gia.

LR_030=Không tìm thấy yêu cầu tham gia.
LR_031=Yêu cầu tham gia đã hết hạn.
LR_032=Bạn đã bị từ chối 3 lần. Không thể gửi yêu cầu cho phòng này.
LR_033=Bạn đã có yêu cầu đang chờ.
LR_034=Bạn đã được duyệt vào phòng này, hãy vào thẳng phòng.

LR_040=Phòng đã đầy, vui lòng thử lại sau.
LR_041=Bạn đã ở trong phòng này.
LR_042=Bạn không trong phòng.
LR_043=Không tìm thấy người tham gia trong phòng này.
LR_044=Bạn cần được chủ phòng duyệt trước khi vào phòng.

LR_050=Bạn không thể tự đuổi chính mình.
LR_051=Bạn đã bị đuổi khỏi phòng này. Vui lòng thử lại sau {0} phút.
LR_052=Bạn không thể bật mic trong {0} giây.

LR_060=Tin nhắn không được để trống.
LR_061=Tin nhắn vượt quá 500 ký tự.

LR_070=Bạn chỉ có thể chọn bài hát của chính mình.
LR_071=Bài hát chưa sẵn sàng để phát.
LR_072=Không có bài hát nào đang phát.
LR_073=Vị trí phát không hợp lệ.
LR_074=Âm lượng phải từ 0 đến 100.
LR_075=Nhạc đã được điều khiển bởi người khác. Vui lòng thử lại.
LR_076=Chủ phòng đã rời. Nhạc đang tạm dừng. Vui lòng chờ chủ phòng quay lại.
LR_077=Không tải được file nhạc.

LR_080=Bạn không có quyền theo dõi phòng này.
