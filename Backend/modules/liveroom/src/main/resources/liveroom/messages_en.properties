# Success messages
LIVEROOM_ROOM_CREATED=Room created successfully
LIVEROOM_ROOM_RETRIEVED=Room retrieved successfully
LIVEROOM_ROOM_JOINED=You have joined the room
LIVEROOM_ROOM_LEFT=You have left the room
LIVEROOM_ROOM_ENDED=Room has been ended
LIVEROOM_ROOM_REOPENED=Room has been reopened
LIVEROOM_ROOM_REVIVED=Room has been revived by owner
LIVEROOM_REQUEST_CREATED=Join request sent
LIVEROOM_REQUEST_APPROVED=Join request approved
LIVEROOM_REQUEST_REJECTED=Join request rejected
LIVEROOM_REQUEST_CANCELLED=Join request cancelled
LIVEROOM_PARTICIPANT_KICKED=Participant removed from the room
LIVEROOM_MIC_MUTED=Participant microphone muted
LIVEROOM_MEDIA_UPDATED=Camera and microphone state updated

# Warning messages
LIVEROOM_ROOM_FULL=Room is full. Please try later
LIVEROOM_REJECTED_BY_OWNER=Join request rejected by owner
LIVEROOM_ROOM_AUTO_ENDED_OWNER_GRACE=Room ended - owner did not return
LIVEROOM_OWNER_GRACE_EXPIRING=Owner has {0} seconds to rejoin
LIVEROOM_AUTO_ENDED_GRACE=Room ended automatically (owner left)
LIVEROOM_AUTO_ENDED_EMPTY=Room ended (no participants)
LIVEROOM_MEDIA_PERMISSION_DENIED=Camera/microphone permission denied. You can still listen.
LIVEROOM_MEDIA_NETWORK_UNSTABLE=Network unstable. Consider turning off video.
LIVEROOM_MEDIA_CONNECTING=Connecting to media stream...
LIVEROOM_MULTI_TAB_CONFLICT=You are in this room in another tab
LIVEROOM_MIC_MUTED_BY_OWNER=Owner has muted your microphone
LIVEROOM_MUSIC_OWNER_PAUSED=Owner left, music auto-paused

# Live Room Error Codes
LR_001=Room not found.
LR_002=Room has ended.
LR_003=You already own a room with this name.
LR_004=Room name is invalid.
LR_005=Could not allocate a unique room code. Please try again.
LR_006=Too many room code attempts. Please try again later.
LR_007=Only ended rooms can be reopened.
LR_008=The undo window has expired.
LR_009=Grace period must be between 30 and 1800 seconds.
LR_010=Room ended due to owner role change.

LR_020=Only the owner can perform this action.
LR_021=Only PRO accounts can create rooms.
LR_022=You already own this room and do not need to request access.

LR_030=Join request not found.
LR_031=Join request has expired.
LR_032=You have been rejected 3 times. Cannot send more requests to this room.
LR_033=You already have a pending request.
LR_034=You are already approved for this room. Join it directly.

LR_040=Room is full. Please try later.
LR_041=You are already in this room.
LR_042=You are not in this room.
LR_043=Participant not found in this room.
LR_044=You need the owner's approval before joining this room.

LR_050=You cannot kick yourself.
LR_051=You were kicked from this room. Please try again in {0} {0,choice,1#minute|1<minutes}.
LR_052=You cannot unmute for {0} {0,choice,1#second|1<seconds}.

LR_060=Chat message content is empty.
LR_061=Chat message exceeds maximum length.

LR_070=You can only select your own songs.
LR_071=The song is not ready to play yet.
LR_072=No song is currently playing in this room.
LR_073=Playback position is out of range.
LR_074=Volume must be between 0 and 100.
LR_075=Music was controlled by another user. Please try again.
LR_076=Owner has left. Music is paused. Please wait for the owner to return.
LR_077=Failed to load the audio file.

LR_080=You are not allowed to subscribe to this room.
LR_081=You are sending too fast. Please slow down.

LR_090=You cannot send a signal to yourself.
LR_091=Signaling payload is too large.
LR_092=Signaling payload is missing or malformed.
