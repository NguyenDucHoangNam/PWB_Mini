<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">

    <p style="margin:0 0 20px 0;"
       th:text="${bodyText}">Body</p>

    <table role="presentation" cellspacing="0" cellpadding="0" border="0"
           style="margin:8px 0 0 0;width:100%;">
        <tr>
            <td style="background:#fafafa;border:1px solid #e5e5e5;border-radius:12px;padding:16px 18px;">
                <p style="margin:0;font-family:'Courier New',Courier,monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#0a0a0a;font-weight:700;">
                    <span th:text="${eyebrow}">Status</span>
                </p>
                <p style="margin:6px 0 0 0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.6;color:#0a0a0a;">
                    <span th:text="${cardBody}">Your password was updated successfully.</span>
                </p>
            </td>
        </tr>
    </table>

    <p style="margin:24px 0 0 0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.65;color:#737373;">
        <span th:text="${warningText}">If this wasn't you, please contact our support team immediately.</span>
    </p>

</th:block>
</body>
</html>
