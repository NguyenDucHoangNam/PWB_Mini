<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">

    <p style="margin:0 0 24px 0;"
       th:text="${bodyText}">Body</p>

    <table role="presentation" cellspacing="0" cellpadding="0" border="0"
           style="margin:24px auto;width:100%;">
        <tr>
            <td align="center" style="padding:8px 0 8px 0;">
                <a th:href="${resetLink}"
                   style="display:inline-block;background:#0a0a0a;color:#ffffff;text-decoration:none;
                          font-family:'Courier New',Courier,monospace;font-size:13px;font-weight:700;
                          letter-spacing:0.2em;text-transform:uppercase;
                          padding:14px 36px;border-radius:999px;border:2px solid #0a0a0a;">
                    <span th:text="${ctaText}">Reset password</span>
                </a>
            </td>
        </tr>
    </table>

    <p style="margin:24px 0 6px 0;font-family:'Courier New',Courier,monospace;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#737373;font-weight:700;">
        <span th:text="${copyLinkHint}">Or copy this link</span>
    </p>
    <p style="margin:0;font-family:'Courier New',Courier,monospace;font-size:12px;word-break:break-all;color:#0a0a0a;background:#fafafa;border:1px solid #e5e5e5;border-radius:8px;padding:10px 12px;"
       th:text="${resetLink}">link</p>

    <p style="margin:16px 0 0 0;font-family:'Courier New',Courier,monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#0a0a0a;font-weight:700;"
       th:text="${ttlNotice}">Valid for 30 minutes</p>

    <p style="margin:24px 0 0 0;color:#737373;font-size:12px;line-height:1.6;"
       th:text="${farewellText}">Farewell</p>

</th:block>
</body>
</html>
