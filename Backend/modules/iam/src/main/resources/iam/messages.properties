IAM_006=Tài khoản đang không hoạt động
IAM_007=Tài khoản chưa được xác thực
IAM_008=Token xác thực không hợp lệ
IAM_009=Token xác thực đã hết hạn
IAM_010=Token xác thực là bắt buộc
IAM_011=Refresh token không hợp lệ
IAM_012=Refresh token đã hết hạn
IAM_013=Refresh token đã bị thu hồi
IAM_014=Quá nhiều yêu cầu. Vui lòng chậm lại
IAM_015=Mật khẩu hiện tại không chính xác
IAM_016=Mật khẩu mới phải khác mật khẩu hiện tại
IAM_017=Vui lòng đợi trước khi yêu cầu đặt lại mật khẩu khác
IAM_018=Vai trò mặc định không tồn tại trong cơ sở dữ liệu
IAM_021=Mã OTP không hợp lệ
IAM_022=Mã OTP đã hết hạn
IAM_026=Quá nhiều yêu cầu. Vui lòng thử lại sau
IAM_027=Bạn đã đạt đến giới hạn yêu cầu mã xác thực hàng ngày. Vui lòng thử lại vào ngày mai.
IAM_030=Mật khẩu đã được sử dụng gần đây. Vui lòng chọn mật khẩu khác
IAM_031=Token đặt lại mật khẩu không hợp lệ hoặc đã hết hạn
IAM_033=Tài khoản OAuth không có mật khẩu
IAM_034=Dịch vụ tạm thời không khả dụng. Vui lòng thử lại sau
IAM_ACCESS_001=Truy cập bị từ chối do không đủ quyền
IAM_GOOGLE_001=Token Google không hợp lệ hoặc đã hết hạn
IAM_GOOGLE_002=Email Google chưa được xác thực
IAM_PROFILE_001=Định dạng ảnh đại diện không hợp lệ. Chỉ chấp nhận: JPEG, PNG, WebP
IAM_PROFILE_002=Dung lượng ảnh đại diện không được vượt quá 5MB

# Registration
AUTH_REGISTER_SUCCESSFUL=Đăng ký thành công, vui lòng xác thực email của bạn
AUTH_REGISTER_MESSAGE=Mã xác thực đã được gửi đến email của bạn
AUTH_EMAIL_ALREADY_EXISTS=Địa chỉ email đã được đăng ký
AUTH_EMAIL_ALREADY_VERIFIED=Địa chỉ email đã được xác thực

# Data Integrity
DATA_INTEGRITY_VIOLATION=Xảy ra lỗi vi phạm tính toàn vẹn dữ liệu

# OTP
AUTH_OTP_SENT=Mã xác thực đã được gửi đến email của bạn
AUTH_OTP_INVALID=Mã xác thực không hợp lệ
AUTH_OTP_EXPIRED=Mã xác thực đã hết hạn
AUTH_OTP_TOO_MANY_REQUESTS=Quá nhiều yêu cầu, vui lòng đợi trước khi thử lại
AUTH_OTP_RESENT=Mã xác thực đã được gửi lại đến email của bạn
AUTH_OTP_COOLDOWN=Vui lòng đợi {0} giây trước khi yêu cầu mã khác
AUTH_OTP_DAILY_LIMIT_EXCEEDED=Bạn đã đạt đến giới hạn yêu cầu mã xác thực hàng ngày. Vui lòng thử lại vào ngày mai.
AUTH_VERIFY_OTP_SUCCESSFUL=Xác thực email thành công

# Password
AUTH_PASSWORD_UPDATED=Mật khẩu đã được cập nhật thành công
AUTH_PASSWORD_WEAK=Mật khẩu không đáp ứng yêu cầu bảo mật
AUTH_PASSWORD_MISMATCH=Mật khẩu mới và xác nhận mật khẩu không khớp
AUTH_PASSWORD_SAME_AS_OLD=Mật khẩu mới phải khác mật khẩu hiện tại
AUTH_PASSWORD_RECENTLY_USED=Mật khẩu đã được sử dụng gần đây. Vui lòng chọn mật khẩu khác.
AUTH_FORGOT_PASSWORD_EMAIL_SENT=Hướng dẫn đặt lại mật khẩu đã được gửi đến email của bạn
AUTH_PASSWORD_RESET_SUCCESSFUL=Đặt lại mật khẩu thành công
password.violation.too_short=Mật khẩu phải có ít nhất {0} ký tự
password.violation.too_long=Mật khẩu không được vượt quá {0} ký tự
password.violation.missing_upper=Mật khẩu phải chứa ít nhất một chữ cái viết hoa
password.violation.missing_lower=Mật khẩu phải chứa ít nhất một chữ cái viết thường
password.violation.missing_digit=Mật khẩu phải chứa ít nhất một chữ số
password.violation.missing_special=Mật khẩu phải chứa ít nhất một ký tự đặc biệt
password.violation.contains_whitespace=Mật khẩu không được chứa khoảng trắng
password.violation.null=Mật khẩu là bắt buộc

# Account
AUTH_ACCOUNT_LOCKED=Tài khoản bị tạm khóa do quá nhiều lần đăng nhập thất bại
AUTH_ACCOUNT_INACTIVE=Tài khoản đang không hoạt động, vui lòng liên hệ hỗ trợ
AUTH_ACCOUNT_SUSPENDED=Tài khoản đã bị đình chỉ
AUTH_SESSION_REVOKED=Phiên đăng nhập đã bị thu hồi
AUTH_SESSION_EXISTS=Một phiên đăng nhập khác đang hoạt động

# Google OAuth
AUTH_GOOGLE_LOGIN_SUCCESSFUL=Đăng nhập bằng Google thành công
AUTH_GOOGLE_LOGIN_FAILED=Đăng nhập bằng Google thất bại
AUTH_GOOGLE_TOKEN_INVALID=Token Google không hợp lệ

# Token Refresh
AUTH_REFRESH_TOKEN_SUCCESSFUL=Làm mới token thành công
AUTH_REFRESH_TOKEN_INVALID=Refresh token không hợp lệ hoặc đã hết hạn
AUTH_REFRESH_TOKEN_MISSING=Refresh token không tìm thấy. Vui lòng đăng nhập lại.

# Profile
AUTH_PROFILE_UPDATED=Thông tin cá nhân đã được cập nhật thành công
AUTH_PROFILE_UPDATE_FAILED=Cập nhật thông tin cá nhân thất bại
AUTH_PROFILE_NOT_FOUND=Không tìm thấy thông tin cá nhân
PROFILE_RETRIEVED=Lấy thông tin cá nhân thành công
PROFILE_AVATAR_UPLOADED=Tải lên ảnh đại diện thành công
PROFILE_INVALID_AVATAR_FORMAT=Định dạng ảnh đại diện không hợp lệ. Chỉ chấp nhận: JPEG, PNG, WebP
PROFILE_AVATAR_TOO_LARGE=Dung lượng ảnh đại diện không được vượt quá 5MB

