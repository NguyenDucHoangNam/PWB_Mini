spring:
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - com.pwb.infra.config.InfraAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

pwb:
  iam:
    jwt:
      secret: "test-jwt-secret-with-at-least-32-characters-for-hs256-signing-1234567890"
      issuer: "pwb-iam-test"
      audience: "pwb-test-clients"
      access-ttl-seconds: 900
      clock-skew-seconds: 30
    refresh-token:
      ttl-seconds: 1209600
      rotation-enabled: true
      raw-token-bytes: 48
    login-policy:
      max-failures: 5
      lock-minutes: 15
      ip-max-failures: 100
      ip-lock-minutes: 30
    rate-limit:
      login-per-minute: 1000
      refresh-per-minute: 1000
      fail-closed-for-critical-ops: false
    password-policy:
      min-length: 12
      max-length: 128
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special: true
      history-size: 5
    password-reset:
      token-secret: "test-password-reset-secret-with-at-least-32-characters-for-hmac"
      token-ttl-minutes: 30
      cooldown-seconds: 60
      frontend-url: "http://localhost:3000"
      reset-path: "/reset-password"
    otp:
      ttl-minutes: 5
      max-attempts: 5
      daily-limit: 3
      resend-cooldown-seconds: 1
    google:
      client-id: "test-google-client-id.apps.googleusercontent.com"
      clock-skew-seconds: 30
    security:
      public-endpoints:
        - /api/v1/auth/register
        - /api/v1/auth/verify-otp
        - /api/v1/auth/resend-otp
        - /api/v1/auth/login
        - /api/v1/auth/refresh
        - /api/v1/auth/forgot-password
        - /api/v1/auth/reset-password
        - /api/v1/auth/google-login
    seeder:
      enabled: false
  outbox:
    enabled: false
    relay:
      enabled: false
    sink: none