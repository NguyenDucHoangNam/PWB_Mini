# System
SYS_000=Lỗi hệ thống không xác định.
SYS_001=Dữ liệu đầu vào không hợp lệ.
SYS_002=Cần xác thực.
SYS_003=Không có quyền truy cập.

# IAM
IAM_001=Email đã được đăng ký.
IAM_002=Mật khẩu không đủ mạnh.
IAM_003=Không tìm thấy người dùng.
IAM_004=Google ID token không hợp lệ hoặc đã hết hạn.
IAM_005=Email Google chưa được xác minh.
IAM_010=Mật khẩu hiện tại không đúng.
IAM_011=Mật khẩu mới phải khác mật khẩu hiện tại.
IAM_012=Tài khoản chưa được xác minh.
IAM_013=Email hoặc mật khẩu không đúng.
IAM_014=Token đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.
IAM_015=Tài khoản OAuth không có mật khẩu.
IAM_016=Token không hợp lệ.
IAM_017=Vui lòng chờ trước khi yêu cầu đặt lại mật khẩu.
IAM_018=Role mặc định không tồn tại trong DB.
IAM_019=Username đã được sử dụng.
IAM_020=Email đã được đăng ký.
IAM_021=Mã OTP không đúng.
IAM_022=Mã OTP đã hết hạn hoặc không tồn tại.
IAM_023=Tài khoản tạm thời bị khóa do nhập sai OTP quá nhiều lần.

# Order/Inventory
ORD_001=Không tìm thấy đơn hàng.
INV_001=Sản phẩm đã hết hàng trong kho.

# Auth success messages
AUTH_REGISTER_SUCCESSFUL=Đăng ký thành công.
AUTH_LOGIN_SUCCESSFUL=Đăng nhập thành công.
AUTH_GOOGLE_LOGIN_SUCCESSFUL=Đăng nhập Google thành công.
AUTH_REFRESH_TOKEN_SUCCESSFUL=Làm mới token thành công.
AUTH_LOGOUT_SUCCESSFUL=Đăng xuất thành công.
AUTH_VERIFY_OTP_SUCCESSFUL=Xác minh OTP thành công.
AUTH_COMPLETE_PROFILE_SUCCESSFUL=Hoàn thiện hồ sơ thành công.
AUTH_REGISTER_MESSAGE=Đăng ký thành công. Vui lòng kiểm tra email để xác minh.
AUTH_FORGOT_PASSWORD_SENT=Nếu email tồn tại trong hệ thống, liên kết đặt lại đã được gửi.
AUTH_PASSWORD_RESET_SUCCESSFUL=Đặt lại mật khẩu thành công.
AUTH_PASSWORD_CHANGED_SUCCESSFUL=Đổi mật khẩu thành công.
AUTH_OTP_RESENT=OTP đã được gửi lại. Vui lòng kiểm tra email.
AUTH_OTP_COOLDOWN=Vui lòng chờ {0} giây trước khi yêu cầu OTP mới.
AUTH_UNAUTHORIZED=Yêu cầu cần xác thực.
AUTH_ACCESS_DENIED=Bạn không có quyền truy cập.
