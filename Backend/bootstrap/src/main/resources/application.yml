spring:
  application:
    name: pwb-backend
  lifecycle:
    timeout-shutdown: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pwb_db}
    username: ${SPRING_DATASOURCE_USERNAME:pwb_user}
    password: ${SPRING_DATASOURCE_PASSWORD:pwb_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        hbm2ddl:
          schema_generation:
            create_schemas: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.web: INFO
    com.pwb: ${LOG_LEVEL_APP:DEBUG}

app:
  security:
    jwt:
      secret: ${APP_JWT_SECRET:}
      refresh-secret: ${APP_JWT_REFRESH_SECRET:}
      access-token-expiration: 900000
      refresh-token-expiration: 604800000
    public-paths:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/google
      - /api/v1/auth/refresh
      - /api/v1/auth/verify-otp
      - /api/v1/auth/resend-otp
      - /api/v1/auth/forgot-password
      - /api/v1/auth/reset-password
      - /actuator/health
      - /v3/api-docs/**
      - /swagger-ui/**
    refresh-token:
      ttl-seconds: 604800
    login-policy:
      enabled: true
      max-fail-attempts: 5
      lock-duration-minutes: 15
    rate-limit:
      enabled: true
      requests-per-hour: 3
  google:
    client-id: ${APP_GOOGLE_CLIENT_ID:}
    clock-skew-seconds: 30
  cookie:
    refresh-name: refresh_token
    secure: ${APP_COOKIE_SECURE:false}
    same-site: Lax
    max-age-seconds: 604800
    path: /
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  password-reset:
    token-ttl-minutes: 30
    cooldown-seconds: 60
    frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
    reset-path: /auth/reset-password
    token-secret: ${APP_PASSWORD_RESET_TOKEN_SECRET:}
  role:
    cache-ttl-seconds: 300
  outbox:
    relay:
      enabled: true
    poll-interval-ms: 5000
    retry:
      max-attempts: 3
      backoff-seconds: [1, 5, 30]
  iam:
    seeder:
      enabled: ${APP_IAM_SEEDER_ENABLED:true}
      users:
        - email: pwb.user01@gmail.com
          password: ${APP_SEED_USER_PASSWORD:}
          fullName: User One
          role: USER
        - email: pwb.user02@gmail.com
          password: ${APP_SEED_USER_PASSWORD:}
          fullName: User Two
          role: USER
        - email: pwb.pro01@gmail.com
          password: ${APP_SEED_USER_PASSWORD:}
          fullName: Pro One
          role: PRO
        - email: pwb.pro02@gmail.com
          password: ${APP_SEED_USER_PASSWORD:}
          fullName: Pro Two
          role: PRO
        - email: pwb.admin01@gmail.com
          password: ${APP_SEED_ADMIN_PASSWORD:}
          fullName: Admin One
          role: ADMIN
        - email: pwb.admin02@gmail.com
          password: ${APP_SEED_ADMIN_PASSWORD:}
          fullName: Admin Two
          role: ADMIN

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs
  show-actuator: false
