spring:
  application:
    name: pwb-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-shutdown: 30s
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        hbm2ddl:
          schema_generation:
            create_schemas: false
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.springframework.web: INFO
    com.pwb.backend: INFO

app:
  security:
    jwt:
      secret: ${APP_JWT_SECRET:01234567890123456789012345678901}
      refresh-secret: ${APP_JWT_REFRESH_SECRET:abcdefghijklmnopqrstuvwxyz123456}
      access-token-expiration: 900000
      refresh-token-expiration: 604800000
    public-paths:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/google
      - /api/v1/auth/refresh
      - /api/v1/auth/verify-otp
      - /api/v1/auth/resend-otp
      - /api/v1/auth/forgot-password
      - /api/v1/auth/reset-password
      - /actuator/health
      - /v3/api-docs/**
      - /swagger-ui/**
    refresh-token:
      ttl-seconds: 604800
    login-policy:
      enabled: true
      max-fail-attempts: 5
      lock-duration-minutes: 15
    rate-limit:
      enabled: true
      requests-per-hour: 3
  google:
    client-id: ${APP_GOOGLE_CLIENT_ID:}
    clock-skew-seconds: 30
  cookie:
    refresh-name: refresh_token
    secure: ${APP_COOKIE_SECURE:false}
    same-site: Lax
    max-age-seconds: 604800
    path: /
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  password-reset:
    token-ttl-minutes: 30
    cooldown-seconds: 60
    frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
    reset-path: /auth/reset-password
  role:
    cache-ttl-seconds: 300
  outbox:
    relay:
      enabled: true
    poll-interval-ms: 5000
    retry:
      max-attempts: 3
      backoff-seconds: [1, 5, 30]
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-from: ${APP_MAIL_FROM:noreply@pwb.app}
    auth-enabled: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
    starttls-enabled: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

spring.mail:
  host: ${SPRING_MAIL_HOST:smtp.gmail.com}
  port: ${SPRING_MAIL_PORT:587}
  username: ${SPRING_MAIL_USERNAME:}
  password: ${SPRING_MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
        starttls:
          enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
          required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

spring.kafka:
  bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
    acks: all
    retries: 3
    properties:
      delivery.timeout.ms: 10000
      request.timeout.ms: 5000
