spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/pwb_db
    username: pwb_user
    password: ${POSTGRES_PASSWORD:pwb_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:pwb_redis_secret_pass}
      database: 0

  cache:
    type: redis
    redis:
      time-to-live: 604800000

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:pwb-backend}
      auto-offset-reset: earliest

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}

app:
  storage:
    s3:
      bucket: ${STORAGE_S3_BUCKET:pwb-storage}
      region: ${STORAGE_S3_REGION:ap-southeast-1}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      endpoint: ${STORAGE_S3_ENDPOINT:}
      path-style-access: ${STORAGE_S3_PATH_STYLE_ACCESS:${STORAGE_S3_PATH_STYLE:false}}
      presigned-url-expiration-minutes: 60
      multipart-upload-threshold-bytes: 26214400

  mail:
    from-address: ${MAIL_FROM_ADDRESS:noreply@pwb.com}
    from-name: ${MAIL_FROM_NAME:PWB}

pwb:
  audio:
    processor:
      # Directory holding ffmpeg and ffprobe. Empty resolves them from PATH.
      ffmpeg-dir: ${PWB_AUDIO_FFMPEG_DIR:}
      working-dir: ${PWB_AUDIO_PROCESSOR_WORKING_DIR:./tmp/pwb-audio}
      cleanup-temp-files: ${PWB_AUDIO_CLEANUP_TEMP_FILES:true}
    upload:
      # Signed into the presigned PUT, so storage refuses a larger body before accepting any of it —
      # and re-checked against storage afterwards as a backstop. 200 MB.
      max-file-size-bytes: ${PWB_AUDIO_MAX_FILE_SIZE_BYTES:209715200}
    tts:
      google:
        # Một file ngoài source tree, không phải `classpath:`. Default cũ trỏ vào
        # `classpath:tts/<service-account>.json`, tức là credential phải nằm trong
        # src/main/resources — chỗ mà Maven đóng thẳng vào jar. Đường dẫn dưới đây tương đối
        # so với working directory, và trỏ vào đúng file mà docker-compose.prod.yml mount
        # làm secret, nên dev và prod không lệch nhau.
        credentials-path: ${GCP_TTS_CREDENTIALS_PATH:secrets/gcp-tts.json}
  outbox:
    enabled: true
    relay:
      enabled: true
      poll-interval-ms: 5000
    retry:
      max-attempts: 3
      backoff-seconds: [1, 5, 30]
