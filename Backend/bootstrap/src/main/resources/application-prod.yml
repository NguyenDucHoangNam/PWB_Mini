spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      database: 0

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID}
      auto-offset-reset: earliest

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  storage:
    max-file-size-bytes: 10485760
    s3:
      bucket: ${STORAGE_S3_BUCKET}
      region: ${STORAGE_S3_REGION}
      access-key: ${STORAGE_S3_ACCESS_KEY}
      secret-key: ${STORAGE_S3_SECRET_KEY}
      endpoint: ${STORAGE_S3_ENDPOINT:}
      path-style-access: ${STORAGE_S3_PATH_STYLE:false}
      presigned-url-expiration-minutes: 60
      multipart-upload-threshold-bytes: 26214400

  mail:
    from-address: ${MAIL_FROM_ADDRESS:noreply@pwb.com}
    from-name: ${MAIL_FROM_NAME:PWB}

pwb:
  audio:
    processor:
      # ffmpeg and ffprobe ship in the application image on PATH; see Backend/Dockerfile.
      ffmpeg-dir: ${PWB_AUDIO_FFMPEG_DIR:}
      # Scratch space for a single job: the source, the voice tag and the rendered output. Sized for the
      # largest song accepted, not for the number of songs queued — jobs run one at a time.
      working-dir: ${PWB_AUDIO_PROCESSOR_WORKING_DIR:/var/tmp/pwb-audio}
      cleanup-temp-files: true
      orphan-retention-hours: ${PWB_AUDIO_ORPHAN_RETENTION_HOURS:6}
      timeout-minutes: ${PWB_AUDIO_TIMEOUT_MINUTES:15}
    upload:
      # Verified against object storage, not trusted from the client. Keep working-dir sized to roughly
      # 2.5x this value, since one job holds the source, the voice tag and the render at the same time.
      max-file-size-bytes: ${PWB_AUDIO_MAX_FILE_SIZE_BYTES:209715200}
  outbox:
    enabled: true
    relay:
      enabled: true
      poll-interval-ms: 2000
    retry:
      max-attempts: 5
      backoff-seconds: [5, 30, 120, 300, 600]
