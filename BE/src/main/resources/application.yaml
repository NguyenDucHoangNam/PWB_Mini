spring:
  application:
    name: pwb-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  thymeleaf:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  lifecycle:
    timeout-shutdown: 30s
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 200

# ── API Documentation ─────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Actuator ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# ── Logging ───────────────────────────────────────────
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:-}] [%thread] %-5level %logger{36} - %msg%n"
  level:
    org.springframework.web: INFO
    com.pwb.backend: INFO

# ── Application Properties ────────────────────────────
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET}
      refresh-secret: ${JWT_REFRESH_SECRET}
      access-token-expiration: 900000      # 15 minutes
      refresh-token-expiration: 604800000  # 7 days
    public-paths:
      - /api/v1/auth/**
      - /actuator/health
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /ws/**
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket-name: ${STORAGE_BUCKET_NAME:pwb-media}
    region: ${STORAGE_REGION:ap-southeast-1}
    public-url-prefix: ${STORAGE_PUBLIC_URL_PREFIX:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    clock-skew-seconds: 30
  auth:
    password-reset:
      token-ttl-minutes: 30
      cooldown-seconds: 60
      frontend-url: ${FRONTEND_URL:http://localhost:3000}
      reset-path: /reset-password

