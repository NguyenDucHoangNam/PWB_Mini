<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject}">PWB</title>
</head>
<body style="margin:0;padding:24px;background:#f9fafb;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0"
       style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;">
    <tr>
        <td>
            <h1 style="margin:0 0 16px 0;color:#2563eb;font-size:20px;" th:text="${subject}">Subject</h1>
            <p style="margin:0 0 24px 0;color:#1f2937;font-size:14px;line-height:1.6;"
               th:text="${bodyText}">Body</p>
            <div style="text-align:center;margin:32px 0;">
                <span style="display:inline-block;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
                             font-size:32px;font-weight:700;letter-spacing:8px;color:#ffffff;
                             background:#2563eb;padding:16px 32px;border-radius:8px;"
                      th:text="${otp}">000000</span>
            </div>
            <p style="margin:24px 0 0 0;color:#6b7280;font-size:13px;line-height:1.6;"
               th:text="${footerText}">Footer</p>
        </td>
    </tr>
</table>
</body>
</html>
