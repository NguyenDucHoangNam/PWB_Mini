<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <title th:text="${title}">Producer Workbench</title>
</head>
<body style="margin:0;padding:0;background:#fafafa;font-family:'Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;color:#0a0a0a;">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
       style="background:#fafafa;padding:32px 16px;">
    <tr>
        <td align="center">

            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                   style="max-width:560px;background:#ffffff;border:1px solid #e5e5e5;border-radius:16px;overflow:hidden;">

                <tr>
                    <td style="padding:24px 32px;background:#0a0a0a;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                                <td align="left" style="vertical-align:middle;">
                                    <img src="cid:pwb-logo"
                                         alt="Producer Workbench"
                                         width="48" height="48"
                                         style="display:block;width:48px;height:48px;border-radius:50%;border:2px solid #ffffff;background:#ffffff;object-fit:cover;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;"/>
                                </td>
                                <td align="right" style="vertical-align:middle;">
                                    <span style="display:inline-block;padding:6px 12px;border:1px solid #ffffff;border-radius:999px;color:#ffffff;font-family:'Courier New',Courier,monospace;font-size:10px;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;">
                                        Producer Workbench
                                    </span>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding:36px 32px 12px 32px;">
                        <h1 style="margin:0;font-family:'Courier New',Courier,monospace;font-size:22px;font-weight:700;line-height:1.3;color:#0a0a0a;letter-spacing:-0.01em;text-transform:uppercase;"
                            th:text="${title}">Title</h1>
                    </td>
                </tr>

                <tr>
                    <td style="padding:0 32px 24px 32px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.65;color:#404040;">

                        <div th:replace="__${childTemplate}__ :: content">Body</div>

                    </td>
                </tr>

                <tr>
                    <td style="padding:20px 32px 28px 32px;border-top:1px solid #e5e5e5;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                                <td style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#737373;">
                                    <p style="margin:0;" th:text="${footerText}">Footer</p>
                                    <p style="margin:10px 0 0 0;font-family:'Courier New',Courier,monospace;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:#0a0a0a;font-weight:700;">
                                        Producer Workbench &middot; <span th:text="${year}">2026</span>
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
