# Reverse proxy for the production stack. Certificates are issued by certbot into a shared volume;
# see nginx/init-letsencrypt.sh for the one-time bootstrap and docker-compose.prod.yml for renewal.
#
# The domain appears literally below rather than through an environment variable. The nginx image
# can substitute variables from a template, but its envsubst pass rewrites every `$name` it sees —
# including nginx's own `$host`, `$request_uri` and `$http_upgrade` — unless it is fenced with a
# regex filter. Two literal names are easier to change and far harder to break.
#
#   Changing domain: edit the three server_name lines and the two ssl_certificate paths, then
#   re-run init-letsencrypt.sh.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # Matches spring.servlet.multipart.max-file-size. Songs do not pass through here at all — the
    # browser uploads them straight to S3 with a presigned URL — but voice tags and avatars do, and
    # nginx rejecting a body before Spring sees it produces a bare 413 with no application error.
    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Docker's embedded DNS server. Without re-resolution nginx looks the container names up once at
    # startup and caches the addresses forever, so the first `docker compose up -d --build` that
    # recreates a container leaves nginx answering 502 until it is restarted by hand.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Drives the Connection header on the WebSocket route below: "upgrade" while a handshake is in
    # progress, "close" otherwise. Hardcoding "upgrade" would break ordinary keep-alive requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ---------------------------------------------------------------------
    # HTTP: ACME challenge, everything else redirected
    # ---------------------------------------------------------------------
    server {
        listen 80;
        server_name producerworkbench.online api.producerworkbench.online;

        # Must stay reachable over plain HTTP forever, not just during the first issuance —
        # renewals every 60 days use the same path.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------
    # Frontend
    # ---------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name producerworkbench.online;

        # One certificate covers both names, so both server blocks point at the same files.
        ssl_certificate     /etc/letsencrypt/live/producerworkbench.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/producerworkbench.online/privkey.pem;

        location / {
            set $frontend_upstream frontend:3000;
            # $request_uri is appended explicitly: once the target contains a variable, nginx stops
            # passing the request path on its own and silently proxies "/" for every request.
            proxy_pass http://$frontend_upstream$request_uri;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---------------------------------------------------------------------
    # Backend API and live room WebSocket
    # ---------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name api.producerworkbench.online;

        ssl_certificate     /etc/letsencrypt/live/producerworkbench.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/producerworkbench.online/privkey.pem;

        # Not reachable from the internet. The container healthcheck calls this over localhost
        # inside the backend container, so it is unaffected.
        location /actuator/ {
            return 404;
        }

        # The live room's STOMP connection. Four of the settings below are the difference between
        # a working room and one that looks fine until it is not:
        #   - proxy_http_version 1.1: the default 1.0 cannot carry an Upgrade at all.
        #   - Upgrade/Connection: nginx does not forward these on its own.
        #   - proxy_read_timeout: the default 60s closes any room where nobody speaks for a minute,
        #     which during a listening session is most of them.
        #   - `/ws`, with no trailing slash. Written as `location /ws/` this block never sees the
        #     native STOMP handshake at all: the client opens exactly `/ws` (LIVEROOM_WS_HTTP_URL in
        #     liveroom-destinations.ts), and a prefix location ending in `/` that carries a
        #     proxy_pass makes nginx answer the slash-less form with its own `301 -> /ws/`. A
        #     browser fails a WebSocket on any response that is not `101`, and never follows the
        #     redirect, so the handshake died there — verified against this file, not just reasoned.
        #     The room still worked, which is what made this hard to see: SockJS asks for `/ws/info`
        #     and `/ws/{server}/{session}/websocket`, both of which matched, so the client fell back
        #     silently after two failed attempts — about three seconds of "reconnecting" on every
        #     single join.
        location /ws {
            set $backend_ws backend:8080;
            proxy_pass http://$backend_ws$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # Buffering a realtime stream would defeat the point of the channel.
            proxy_buffering off;
        }

        location / {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # $remote_addr, not $proxy_add_x_forwarded_for. The latter *appends* to whatever the client
            # sent, and Spring's ForwardedHeaderFilter reads the first entry of the list — so a request
            # carrying its own `X-Forwarded-For: 1.2.3.4` arrived at the application claiming to come
            # from 1.2.3.4, and the rate limiter keyed its bucket on that. Changing the header on every
            # request bought an unlimited number of buckets, which mattered most for the billed TTS
            # synthesis behind the `tts-preview` rule.
            #
            # Overwriting is correct precisely here and nowhere else: this is the edge, so $remote_addr
            # *is* the client and there is no upstream chain worth preserving. Put another proxy or a
            # CDN in front of nginx and this line has to become the one that trusts it.
            proxy_set_header X-Forwarded-For   $remote_addr;
            # Read by Spring because application.yml sets forward-headers-strategy: framework.
            # Without it every cookie loses its Secure flag and generated links say http://.
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
