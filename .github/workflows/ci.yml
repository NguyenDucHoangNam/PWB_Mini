# Test gate. Runs on its own for pull requests, and is called by deploy.yml as the step that has to
# pass before anything is built or shipped.
#
# Only the fast tests live here. Surefire is configured in Backend/pom.xml to exclude **/*IT.java,
# so `mvn test` is pure unit work with nothing to spin up; the Testcontainers suites run under
# failsafe in the separate integration-tests workflow, which is too slow to sit in front of a deploy.
name: CI

on:
  pull_request:
  # `main` is deliberately absent. A push there already runs this workflow as deploy.yml's `test`
  # job, and a second standalone run lands in the same concurrency group below — same ref, so the
  # one that starts second cancels the other. Which one loses is a race decided by the scheduler.
  # Losing the standalone run costs nothing; losing the one inside Deploy skips `build` and `deploy`
  # through `needs:`, so the merge reports "cancelled" rather than "failed" and production is
  # quietly left on the previous version. Coverage is unchanged: PRs into main run this through
  # `pull_request`, and a direct push to main runs it through Deploy.
  push:
    branches: [develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    # The default is six hours. A run that stalls burns all of them, and when this workflow is the
    # `test` job inside Deploy it also holds the deploy-production concurrency slot for that long
    # before reporting "cancelled" — which reads as noise rather than as a deploy that never shipped.
    # The suite itself is ~65s; 15 minutes is well clear of that and of a cold Maven cache.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # AudioProbeService's tests shell out to the real ffprobe rather than mocking it, so the
      # binary has to exist on the runner. It is not part of the base image on every runner
      # generation, and when it is missing those tests fail on a message about the process, not
      # about the package — installing it unconditionally is cheaper than diagnosing that later.
      #
      # apt has no network timeout of its own, so a degraded archive mirror does not fail here — it
      # waits. On 2026-08-19 this step went 21s, then 12m, then hung until the job hit its six-hour
      # ceiling with the tests never started. Acquire::http::Timeout bounds each request and the
      # step timeout bounds the whole thing, so a bad mirror now costs five minutes and a red step
      # that says which step it was.
      - name: Install ffmpeg
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v ffprobe >/dev/null && command -v ffmpeg >/dev/null; then
            echo "already on the image"
            exit 0
          fi
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20"
          sudo apt-get update $APT_OPTS
          sudo apt-get install -y $APT_OPTS ffmpeg

      - name: Unit tests
        working-directory: Backend
        run: mvn -B -ntp test

  frontend:
    name: Frontend lint and tests
    runs-on: ubuntu-latest
    # Runs in about a minute; same reasoning as the backend job's ceiling.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pinned to the same major the Frontend Dockerfile installs. A different pnpm here would
      # resolve the lockfile differently from the image that actually ships.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml

      - name: Install
        working-directory: Frontend
        run: pnpm install --frozen-lockfile

      # Reports 20 warnings and no errors today, so this passes. It is here to stop new *errors*,
      # not to enforce a clean slate — adding --max-warnings 0 would fail the build on day one.
      - name: Lint
        working-directory: Frontend
        run: pnpm lint

      - name: Unit tests
        working-directory: Frontend
        run: pnpm test
