spring:
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      database: 0

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID}
      auto-offset-reset: earliest

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  storage:
    provider: ${STORAGE_PROVIDER:S3}
    max-file-size-bytes: 10485760
    s3:
      bucket: ${STORAGE_S3_BUCKET}
      region: ${STORAGE_S3_REGION}
      access-key: ${STORAGE_S3_ACCESS_KEY}
      secret-key: ${STORAGE_S3_SECRET_KEY}
      endpoint: ${STORAGE_S3_ENDPOINT:}
      path-style-access: ${STORAGE_S3_PATH_STYLE:false}
      presigned-url-expiration-minutes: 60
      multipart-upload-threshold-bytes: 26214400
    local:
      base-path: ${STORAGE_LOCAL_BASE_PATH:/tmp/pwb-storage}

  mail:
    from-address: ${MAIL_FROM_ADDRESS:noreply@pwb.com}
    from-name: ${MAIL_FROM_NAME:PWB}
