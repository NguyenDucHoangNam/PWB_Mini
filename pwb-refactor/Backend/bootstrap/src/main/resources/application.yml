spring:
  application:
    name: pwb-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    include: dev-users
  jpa:
    open-in-view: false
  flyway:
    out-of-order: true

server:
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    com.pwb: INFO
    org.springframework: WARN
    org.hibernate: WARN

pwb:
  cors:
    allowed-origins:
      - http://localhost:3000
  outbox:
    enabled: true
    relay:
      enabled: true
      poll-interval-ms: 5000
      batch-size: 20
    retry:
      max-attempts: 3
      backoff-seconds: [1, 5, 30]
  iam:
    jwt:
      secret: ${APP_JWT_SECRET:change-me-change-me-change-me-change-me-1234567890}
      issuer: pwb-iam
      audience: pwb-clients
      access-ttl-seconds: 900
      clock-skew-seconds: 30
    security:
      public-endpoints:
        - /api/v1/auth/register
        - /api/v1/auth/verify-otp
        - /api/v1/auth/resend-otp
        - /api/v1/auth/login
        - /api/v1/auth/refresh
        - /api/v1/auth/forgot-password
        - /api/v1/auth/reset-password
        - /api/v1/auth/google-login
    otp:
      ttl-minutes: 10
      resend-cooldown-seconds: 60
      max-attempts: 5
      code-length: 6
      daily-limit: 10
    password-policy:
      min-length: 12
      max-length: 128
    refresh-token:
      ttl-seconds: 1209600
      rotation-enabled: true
      raw-token-bytes: 48
    login-policy:
      max-failures: 5
      lock-minutes: 15
      ip-max-failures: 20
      ip-lock-minutes: 30
    rate-limit:
      login-per-minute: 10
      refresh-per-minute: 30
    password-reset:
      token-secret: ${APP_PASSWORD_RESET_TOKEN_SECRET:dev-only-not-secure-replace-in-production-32chars}
      token-ttl-minutes: 30
      cooldown-seconds: 60
      frontend-url: ${FRONTEND_URL:http://localhost:3000}
      reset-path: /reset-password
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      clock-skew-seconds: 30
    audit:
      consumer:
        enabled: true
        group: iam-audit-consumer

kafka:
  topics:
    email: notification.email.v1
    iam-audit: iam.audit.v1
