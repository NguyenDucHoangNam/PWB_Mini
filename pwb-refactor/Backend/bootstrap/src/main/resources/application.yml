spring:
  application:
    name: pwb-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false

server:
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    com.pwb: INFO
    org.springframework: WARN
    org.hibernate: WARN

pwb:
  outbox:
    enabled: true
    relay:
      enabled: true
      poll-interval-ms: 5000
      batch-size: 20
    retry:
      max-attempts: 3
      backoff-seconds: [1, 5, 30]
