spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/pwb_db
    username: pwb_user
    password: ${POSTGRES_PASSWORD:pwb_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:pwb_redis_secret_pass}
      database: 0

  cache:
    type: redis
    redis:
      time-to-live: 604800000

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:pwb-backend}
      auto-offset-reset: earliest

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  storage:
    provider: ${STORAGE_PROVIDER:LOCAL}
    max-file-size-bytes: 10485760
    s3:
      bucket: ${STORAGE_S3_BUCKET:pwb-storage}
      region: ${STORAGE_S3_REGION:ap-southeast-1}
      access-key: ${STORAGE_S3_ACCESS_KEY:minioadmin}
      secret-key: ${STORAGE_S3_SECRET_KEY:minioadmin}
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
      path-style-access: true
      presigned-url-expiration-minutes: 60
      multipart-upload-threshold-bytes: 26214400
    local:
      base-path: ${STORAGE_LOCAL_BASE_PATH:/tmp/pwb-storage}

  mail:
    from-address: ${MAIL_FROM_ADDRESS:noreply@pwb.com}
    from-name: ${MAIL_FROM_NAME:PWB}

pwb:
  outbox:
    enabled: true
    relay:
      enabled: true
      poll-interval-ms: 5000
    retry:
      max-attempts: 3
      backoff-seconds: [1, 5, 30]
