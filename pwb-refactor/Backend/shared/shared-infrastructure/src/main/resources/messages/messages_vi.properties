# Storage Error Codes (keys phải khớp với StorageErrorCode enum)
STORAGE_001=Tải lên storage thất bại.
STORAGE_002=Tải xuống storage thất bại.
STORAGE_003=Không tìm thấy đối tượng trong storage.
STORAGE_004=Xóa đối tượng trong storage thất bại.
STORAGE_005=Tạo presigned URL thất bại.
STORAGE_006=Định dạng storage key không hợp lệ.
