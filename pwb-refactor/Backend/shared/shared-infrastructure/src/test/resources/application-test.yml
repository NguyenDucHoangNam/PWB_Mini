spring:
  autoconfigure:
    exclude:
      - com.pwb.infra.config.InfraAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    consumer:
      auto-offset-reset: earliest
  mail:
    host: localhost
    port: 1025

pwb:
  outbox:
    enabled: false
    relay:
      enabled: false
