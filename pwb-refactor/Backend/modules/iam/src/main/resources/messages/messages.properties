# Authentication
AUTH_LOGIN_SUCCESSFUL=Login successful
AUTH_LOGIN_FAILED=Invalid email or password
AUTH_LOGOUT_SUCCESSFUL=Logout successful
AUTH_TOKEN_EXPIRED=Session expired, please login again
AUTH_TOKEN_INVALID=Invalid or malformed token
AUTH_ACCESS_DENIED=Access denied

# Registration
AUTH_REGISTER_SUCCESSFUL=Registration successful, please verify your email
AUTH_REGISTER_MESSAGE=A verification code has been sent to your email
AUTH_EMAIL_ALREADY_EXISTS=Email address is already registered
AUTH_EMAIL_ALREADY_VERIFIED=Email address is already verified

# OTP
AUTH_OTP_SENT=Verification code sent to your email
AUTH_OTP_INVALID=Invalid verification code
AUTH_OTP_EXPIRED=Verification code has expired
AUTH_OTP_TOO_MANY_REQUESTS=Too many requests, please wait before trying again
AUTH_OTP_RESENT=Verification code resent to your email
AUTH_OTP_COOLDOWN=Please wait {0} seconds before requesting another code
AUTH_VERIFY_OTP_SUCCESSFUL=Email verified successfully

# Password
AUTH_PASSWORD_UPDATED=Password updated successfully
AUTH_PASSWORD_WEAK=Password does not meet security requirements
AUTH_PASSWORD_MISMATCH=New password and confirmation password do not match
AUTH_PASSWORD_SAME_AS_OLD=New password must be different from current password
AUTH_FORGOT_PASSWORD_EMAIL_SENT=Password reset instructions sent to your email
AUTH_PASSWORD_RESET_SUCCESSFUL=Password reset successful

# Account
AUTH_ACCOUNT_LOCKED=Account is temporarily locked due to too many failed attempts
AUTH_ACCOUNT_INACTIVE=Account is inactive, please contact support
AUTH_ACCOUNT_SUSPENDED=Account has been suspended
AUTH_SESSION_REVOKED=Session has been revoked
AUTH_SESSION_EXISTS=Another session is already active

# Google OAuth
AUTH_GOOGLE_LOGIN_SUCCESSFUL=Login with Google successful
AUTH_GOOGLE_LOGIN_FAILED=Login with Google failed
AUTH_GOOGLE_TOKEN_INVALID=Invalid Google token

# Token Refresh
AUTH_REFRESH_TOKEN_SUCCESSFUL=Token refreshed successfully
AUTH_REFRESH_TOKEN_INVALID=Invalid or expired refresh token

# Profile
AUTH_PROFILE_INCOMPLETE=Please complete your profile
AUTH_PROFILE_UPDATED=Profile updated successfully
AUTH_PROFILE_UPDATE_FAILED=Failed to update profile
AUTH_PROFILE_NOT_FOUND=User profile not found
AUTH_COMPLETE_PROFILE_SUCCESSFUL=Profile completed successfully
