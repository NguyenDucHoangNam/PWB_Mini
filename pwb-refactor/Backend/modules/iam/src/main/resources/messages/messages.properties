AUTH_PASSWORD_RECENTLY_USED=Password was recently used. Please choose a different password.
AUTH_FORGOT_PASSWORD_EMAIL_SENT=Password reset instructions sent to your email
AUTH_PASSWORD_RESET_SUCCESSFUL=Password reset successful
