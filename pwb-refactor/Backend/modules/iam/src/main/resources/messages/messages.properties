AUTH_GOOGLE_LOGIN_SUCCESSFUL=Login with Google successful
AUTH_GOOGLE_LOGIN_FAILED=Login with Google failed
AUTH_GOOGLE_TOKEN_INVALID=Invalid Google token

# Token Refresh
AUTH_REFRESH_TOKEN_SUCCESSFUL=Token refreshed successfully
AUTH_REFRESH_TOKEN_INVALID=Invalid or expired refresh token

# Profile
AUTH_PROFILE_UPDATED=Profile updated successfully
AUTH_PROFILE_UPDATE_FAILED=Failed to update profile
AUTH_PROFILE_NOT_FOUND=User profile not found

