<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">

    <p style="margin:0 0 20px 0;"
       th:text="${bodyText}">Body</p>

    <table role="presentation" cellspacing="0" cellpadding="0" border="0"
           style="margin:24px auto;width:100%;">
        <tr>
            <td align="center" style="padding:8px 0 24px 0;">
                <span style="display:inline-block;font-family:'Courier New',Courier,monospace;
                             font-size:34px;font-weight:700;letter-spacing:10px;color:#0a0a0a;
                             background:#fafafa;border:2px solid #0a0a0a;border-radius:12px;
                             padding:18px 36px;min-width:240px;text-align:center;"
                      th:text="${otp}">000000</span>
            </td>
        </tr>
    </table>

    <p style="margin:8px 0 0 0;font-family:'Courier New',Courier,monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#0a0a0a;font-weight:700;">
        Valid for <span th:text="${ttlMinutes}">15</span> minutes
    </p>

</th:block>
</body>
</html>
