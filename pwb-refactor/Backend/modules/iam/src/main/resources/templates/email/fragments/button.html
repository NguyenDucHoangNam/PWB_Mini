<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<table th:fragment="button(href, label)" role="presentation" cellpadding="0" cellspacing="0" border="0"
       style="margin:24px 0;">
    <tr>
        <td align="center" bgcolor="#2563eb" style="border-radius:6px;">
            <a th:href="${href}"
               style="display:inline-block;padding:12px 32px;color:#ffffff;text-decoration:none;
                      font-weight:bold;font-size:16px;font-family:Arial,Helvetica,sans-serif;"
               th:text="${label}">Click here</a>
        </td>
    </tr>
</table>
</body>
</html>
