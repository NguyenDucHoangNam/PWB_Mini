<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <h2 style="margin:0 0 16px 0;color:#1f2937;font-size:22px;font-weight:bold;"
        th:text="#{email.password_reset.headline}">Reset your PWB password</h2>
    <p style="margin:0 0 16px 0;color:#4b5563;font-size:16px;line-height:1.6;"
       th:text="#{email.password_reset.intro}">You requested a password reset. Click the button below to continue:</p>
    <div th:replace="~{email/fragments/button :: button(${resetLink}, #{email.password_reset.cta})}"></div>
    <p style="margin:16px 0 0 0;color:#6b7280;font-size:14px;line-height:1.5;"
       th:text="#{email.password_reset.ignore_notice}">If you did not request this, please ignore this email.</p>
</div>
</body>
</html>
