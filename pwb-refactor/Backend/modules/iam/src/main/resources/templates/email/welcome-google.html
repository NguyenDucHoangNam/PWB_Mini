<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <h2 style="margin:0 0 16px 0;color:#1f2937;font-size:22px;font-weight:bold;"
        th:text="#{email.welcome_google.headline}">Welcome to PWB</h2>
    <p style="margin:0 0 16px 0;color:#4b5563;font-size:16px;line-height:1.6;"
       th:text="#{email.welcome_google.greeting(${displayName})}">Hi there,</p>
    <p style="margin:0 0 16px 0;color:#4b5563;font-size:16px;line-height:1.6;"
       th:text="#{email.welcome_google.body}">Your account has been successfully registered via Google.</p>
    <p style="margin:0 0 8px 0;color:#6b7280;font-size:14px;line-height:1.5;"
       th:text="#{email.welcome_google.support}">If you need help, please reply to this email.</p>
</div>
</body>
</html>
