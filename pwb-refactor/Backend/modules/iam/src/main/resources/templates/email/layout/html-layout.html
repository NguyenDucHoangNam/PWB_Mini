<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle}">PWB</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
       style="background-color:#f4f6f8;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"
                   style="max-width:600px;background-color:#ffffff;border-radius:8px;overflow:hidden;
                          box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                <tr th:replace="~{email/fragments/header :: header}"></tr>
                <tr>
                    <td style="padding:32px 40px;color:#1f2937;font-size:16px;line-height:1.6;">
                        <div th:replace="${contentFragment}">Content</div>
                    </td>
                </tr>
                <tr th:replace="~{email/fragments/footer :: footer}"></tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
